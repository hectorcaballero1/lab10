services:
  db:
    image: postgres:17
    container_name: lab10-db
    environment:
      POSTGRES_DB: labsimilarity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${PGPORT:-5434}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labsimilarity"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
